name: Bug Report
description: Create a report to help us fix a bug or issue.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to help improve this project.
        Please complete the form as accurately and thoroughly as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Explain steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior / Logs
      description: What actually happened? Paste terminal output, stack traces, or console logs here.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity / Priority
      description: How severe is this bug?
      options:
        - Critical (System broken / App crashes)
        - High (Core functionality failing)
        - Medium (Non-critical feature broken)
        - Low (Cosmetic / Typo / Minor UI issue)
    validations:
      required: true

  - type: input
    id: os-env
    attributes:
      label: Environment / OS
      description: Operating System, Browser, or Node/Python version.
      placeholder: e.g. macOS Sonoma / Chrome v124 / Node v20.10.0
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
